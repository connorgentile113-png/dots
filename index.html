.builder-form .field{margin-bottom:16px}.builder-nav{margin-top:22px;justify-content:flex-end}
.builder-templates{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.template-chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;border:1px solid var(--line);border-radius:30px;padding:8px 12px;color:var(--muted)}.template-chip:hover{border-color:#b9c9ac;color:var(--ink)}.template-chip svg{width:14px;height:14px}

.model-grid{display:grid;gap:9px}.model-card{display:block;border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;background:var(--paper)}
.model-card input{position:absolute;opacity:0;pointer-events:none}.model-card.active{border-color:#9fb98e;background:var(--soft)}
.model-name{font-size:12px;font-weight:600;display:inline-block;margin-right:8px}.model-id{font-size:9px;color:#98a08f;font-family:ui-monospace,SFMono-Regular,monospace}
.model-card p{font-size:11px;color:var(--muted);line-height:1.65;margin-top:6px}.model-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.model-tags i{font-size:8px;font-style:normal;letter-spacing:.4px;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:3px 7px}
.rhythm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:16px}
.rhythm-card{display:block;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12px;cursor:pointer}.rhythm-card input{position:absolute;opacity:0;pointer-events:none}.rhythm-card.active{border-color:#9fb98e;background:var(--soft);font-weight:600}
.detail-card .card-tag{margin:0}
