name: Dots sandbox command
run-name: dots-${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      uid: {required: true, type: string}
      run_id: {required: true, type: string}
      operation_id: {required: true, type: string}
      script_b64: {required: true, type: string}
      callback_url: {required: true, type: string}
      callback_token: {required: true, type: string}
permissions: {}
concurrency:
  group: dots-command-${{ inputs.operation_id }}
  cancel-in-progress: false
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.callback_url == 'firebase' }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.callback_url == 'firebase' }}
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies for direct Firestore runner
        if: ${{ inputs.callback_url == 'firebase' }}
        run: npm ci --omit=dev
      - name: Run isolated command via Firestore and continue agent
        if: ${{ inputs.callback_url == 'firebase' }}
        env:
          TASK_UID: ${{ inputs.uid }}
          TASK_RUN_ID: ${{ inputs.run_id }}
          TASK_OPERATION_ID: ${{ inputs.operation_id }}
          TASK_SCRIPT: ${{ inputs.script_b64 }}
          TASK_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          GITHUB_WAKE_SECRET: ${{ secrets.DOTS_WAKE_SECRET }}
          DOTS_PROVIDER_CONFIG: ${{ secrets.DOTS_PROVIDER_CONFIG }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/runner-command.mjs
          node scripts/run-once.mjs
      - name: Run isolated command and publish output to HTTP backend
        if: ${{ inputs.callback_url != 'firebase' }}
        env:
          TASK_UID: ${{ inputs.uid }}
          TASK_RUN_ID: ${{ inputs.run_id }}
          TASK_OPERATION_ID: ${{ inputs.operation_id }}
          TASK_SCRIPT: ${{ inputs.script_b64 }}
          TASK_CALLBACK_URL: ${{ inputs.callback_url }}
          TASK_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          ALLOWED_BACKEND_URL: ${{ secrets.DOTS_BACKEND_URL }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,selectors,subprocess,tempfile,time,urllib.request
          endpoint=os.environ['TASK_CALLBACK_URL']
          expected=os.environ['ALLOWED_BACKEND_URL'].rstrip('/')+'/command-result'
          if endpoint != expected or not endpoint.startswith('https://'):
              raise SystemExit('Callback does not match configured backend')
          token=os.environ['TASK_CALLBACK_TOKEN']
          print('::add-mask::'+token)
          payload={'uid':os.environ['TASK_UID'],'run_id':os.environ['TASK_RUN_ID'],'operation_id':os.environ['TASK_OPERATION_ID']}
          output='';sequence=0
          def send(final=False,code=0):
              global sequence
              sequence+=1
              url=endpoint if final else endpoint.replace('/command-result','/command-output')
              body={**payload,'output':output[-18000:],'exit_code':code,'sequence':sequence}
              request=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Content-Type':'application/json','X-Dots-Token':token})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request,timeout=12) as r: r.read()
                      return
                  except Exception:
                      if attempt==2:
                          if final: raise
                          return
                      time.sleep(1+attempt)
          try:
              subprocess.run(['docker','pull','python:3.12-slim'],check=True,stdout=subprocess.DEVNULL,timeout=75)
              with tempfile.TemporaryDirectory() as directory:
                  script=pathlib.Path(directory)/'task.sh'
                  script.write_bytes(base64.b64decode(os.environ['TASK_SCRIPT'],validate=True));script.chmod(0o444)
                  os.chmod(directory,0o755)
                  command=['docker','run','--rm','--name','dots-sandbox','--network','none','--cap-drop','ALL','--security-opt','no-new-privileges','--memory','256m','--cpus','1','--pids-limit','64','--user','65534:65534','--read-only','--tmpfs','/tmp:rw,nosuid,size=64m','-v',str(script)+':/task.sh:ro','-w','/tmp','python:3.12-slim','sh','/task.sh']
                  process=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  selector=selectors.DefaultSelector();selector.register(process.stdout,selectors.EVENT_READ)
                  started=time.monotonic();last=started
                  while process.poll() is None:
                      if time.monotonic()-started>120:
                          subprocess.run(['docker','kill','dots-sandbox'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);process.kill();output+='\n[Time limit reached]';break
                      for key,_ in selector.select(timeout=1):
                          chunk=os.read(key.fileobj.fileno(),4096)
                          if chunk: output=(output+chunk.decode(errors='replace'))[-18000:]
                      if time.monotonic()-last>=10:send();last=time.monotonic()
                  rest=process.communicate(timeout=10)[0];output=(output+rest.decode(errors='replace'))[-18000:]
                  send(True,process.returncode or 0)
          except Exception as exc:
              output+='\nRunner setup or execution failed: '+type(exc).__name__
              send(True,1)
              raise
          PY
